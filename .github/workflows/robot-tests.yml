name: Robot Framework CI (Android)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # schedule:
  #   - cron: '0 18 * * *'

jobs:
  login-tests:
    # GitHub-hosted macOS runners TIDAK support nested virtualization (HVF)
    # untuk Android emulator sama sekali - baik Intel maupun Apple Silicon
    # (lihat reactivecircus/android-emulator-runner#350, actions/runner-images#9472).
    # Ini kenapa run sebelumnya selalu timeout boot walau sudah dicoba
    # arm64-v8a + headless flags. Linux runner (ubuntu-latest) YANG support
    # hardware acceleration lewat KVM (x86_64 only) - makanya pindah ke sini.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium server
        run: appium --port 4723 > appium.log 2>&1 &

      - name: Run Robot Framework login tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$(ls apk/*.apk | head -n1)"
            robot --outputdir report testcase/

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: report/

      - name: Upload Appium server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: appium.log
